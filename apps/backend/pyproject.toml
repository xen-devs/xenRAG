[project]
name = "xenrag-api"
version = "0.1.0"
description = "FastAPI app plus local ai_core module"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langchain-core",
    "pydantic",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "typing-extensions",
    "langchain-ollama",
    "qdrant-client",
    "neo4j",
    "sentence-transformers",
    "langchain-huggingface",
    "rich",
    "httpx",
    "google-genai>=1.58.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "ai_core"]
