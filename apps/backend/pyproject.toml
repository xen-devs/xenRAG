[project]
name = "xenrag-api"
version = "0.1.0"
description = "FastAPI app plus local ai_core module"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langchain-core",
    "pydantic",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "typing-extensions",
    "langchain-ollama",
    "qdrant-client",
    "neo4j",
    "sentence-transformers",
    "langchain-huggingface",
    "rich",
    "httpx",
    "google-genai>=1.58.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "psycopg[binary]>=3.1",
    "langgraph-checkpoint-postgres>=2.0",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<5",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "ai_core"]
